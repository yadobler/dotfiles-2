colourful: true

# This scheme uses: @slug@
# base00: @base00@
# base01: @base01@
# base02: @base02@
# base03: @base03@
# base04: @base04@
# base05: @base05@
# base06: @base06@
# base07: @base07@
# base08: @base08@
# base09: @base09@
# base0A: @base0A@
# base0B: @base0B@
# base0C: @base0C@
# base0D: @base0D@
# base0E: @base0E@
# base0F: @base0F@

filekinds:
  normal: {foreground: "#@base05@"}
  directory: {foreground: "#@base0D@", is_bold: true}
  symlink: {foreground: "#@base0C@"}
  pipe: {foreground: "#@base04@"}
  block_device: {foreground: "#@base08@"}
  char_device: {foreground: "#@base08@"}
  socket: {foreground: "#@base0E@"}
  special: {foreground: "#@base0F@"}
  executable: {foreground: "#@base0B@", is_bold: true}
  mount_point: {foreground: "#@base09@"}

perms:
  user_read: {foreground: "#@base05@"}
  user_write: {foreground: "#@base0A@"}
  user_execute_file: {foreground: "#@base0B@"}
  user_execute_other: {foreground: "#@base0B@"}
  group_read: {foreground: "#@base05@"}
  group_write: {foreground: "#@base0A@"}
  group_execute: {foreground: "#@base0B@"}
  other_read: {foreground: "#@base06@"}
  other_write: {foreground: "#@base0A@"}
  other_execute: {foreground: "#@base0B@"}
  special_user_file: {foreground: "#@base0F@"}
  special_other: {foreground: "#@base04@"}
  attribute: {foreground: "#@base06@"}

size:
  major: {foreground: "#@base06@"}
  minor: {foreground: "#@base0C@"}
  number_byte: {foreground: "#@base05@"}
  number_kilo: {foreground: "#@base05@"}
  number_mega: {foreground: "#@base0D@"}
  number_giga: {foreground: "#@base0F@"}
  number_huge: {foreground: "#@base08@"}
  unit_byte: {foreground: "#@base06@"}
  unit_kilo: {foreground: "#@base0D@"}
  unit_mega: {foreground: "#@base0F@"}
  unit_giga: {foreground: "#@base0F@"}
  unit_huge: {foreground: "#@base08@"}

users:
  user_you: {foreground: "#@base05@"}
  user_root: {foreground: "#@base08@", is_bold: true}
  user_other: {foreground: "#@base0F@"}
  group_yours: {foreground: "#@base05@"}
  group_other: {foreground: "#@base04@"}
  group_root: {foreground: "#@base08@"}

links:
  normal: {foreground: "#@base0C@"}
  multi_link_file: {foreground: "#@base09@"}

git:
  new: {foreground: "#@base0B@"}
  modified: {foreground: "#@base0A@"}
  deleted: {foreground: "#@base08@"}
  renamed: {foreground: "#@base0C@"}
  typechange: {foreground: "#@base0F@"}
  ignored: {foreground: "#@base04@"}
  conflicted: {foreground: "#@base08@", is_bold: true}

git_repo:
  branch_main: {foreground: "#@base05@"}
  branch_other: {foreground: "#@base0F@"}
  git_clean: {foreground: "#@base0B@"}
  git_dirty: {foreground: "#@base08@"}

security_context:
  colon: {foreground: "#@base04@"}
  user: {foreground: "#@base05@"}
  role: {foreground: "#@base0F@"}
  typ: {foreground: "#@base03@"}
  range: {foreground: "#@base0F@"}

file_type:
  image: {foreground: "#@base0F@"}
  video: {foreground: "#@base08@"}
  music: {foreground: "#@base0B@"}
  lossless: {foreground: "#@base0C@"}
  crypto: {foreground: "#@base0E@"}
  document: {foreground: "#@base0D@"}
  compressed: {foreground: "#@base0A@"}
  temp: {foreground: "#@base08@"}
  compiled: {foreground: "#@base0D@"}
  build: {foreground: "#@base04@"}
  source: {foreground: "#@base0D@"}

punctuation: {foreground: "#@base04@"}
date: {foreground: "#@base0A@"}
inode: {foreground: "#@base06@"}
blocks: {foreground: "#@base06@"}
header: {foreground: "#@base05@"}
octal: {foreground: "#@base0C@"}
flags: {foreground: "#@base0F@"}

symlink_path: {foreground: "#@base0C@"}
control_char: {foreground: "#@base0D@"}
broken_symlink: {foreground: "#@base08@"}
broken_path_overlay: {foreground: "#@base04@"}
